spring:
  application:
    name: API-GATEWAY
  cloud:
    gateway:
      server:
        webmvc:
          routes-map:
            student-service:
              uri: lb://STUDENT-SERVICE
              predicates:
                - Path=/students/**
            school-service:
              uri: lb://SCHOOL-SERVICE
              predicates:
                - Path=/schools/**


server:
  port: 8080



